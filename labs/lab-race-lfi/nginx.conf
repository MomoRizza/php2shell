server {
    listen 80;
    root /var/www/html;
    index index.php;
    # KEY CONSTRAINT: 1MB body limit makes OOM unreachable
    # You must race: keep the upload alive while triggering LFI
    client_max_body_size 1m;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
